<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Lecture to Markdown pipeline</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <style>
      .bg   { fill: #fafbfc; stroke: #e1e4e8; }
      .file { fill: #ffffff; stroke: #9aa3ad; stroke-width: 1.2; }
      .tool { fill: #e8f0fe; stroke: #4a7bd0; stroke-width: 1.2; }
      .llm  { fill: #f3ebfc; stroke: #8a5cc7; stroke-width: 1.2; }
      .final{ fill: #e9f7ef; stroke: #2f9e6b; stroke-width: 2; }
      .dest { fill: #fff8e6; stroke: #c99a2e; stroke-width: 1.2; }
      .t    { font-size: 13px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
      .s    { font-size: 11px; fill: #57606a; text-anchor: middle; }
      .sl   { text-anchor: start; }
      .lane { font-size: 11px; font-weight: 700; fill: #8b949e; letter-spacing: 1.5px; }
      .note { font-size: 11px; fill: #6b7280; font-style: italic; }
      .h    { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .a    { fill: none; stroke: #6b7280; stroke-width: 1.4; marker-end: url(#arr); }
      .ad   { fill: none; stroke: #6b7280; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#arr); }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="1238" height="468" rx="12"/>
  <text class="h" x="20" y="30">Lecture → Markdown pipeline</text>

  <!-- lane labels -->
  <text class="lane" x="190" y="54">AUDIO</text>
  <text class="lane" x="190" y="164">VIDEO</text>
  <text class="lane" x="1180" y="304" text-anchor="end">DOCUMENT</text>

  <!-- source -->
  <rect class="file" x="20" y="170" width="140" height="46" rx="8"/>
  <text class="t" x="90" y="189">lecture.mp4</text>
  <text class="s" x="90" y="205">1920×804, ~5 h</text>

  <!-- AUDIO lane (y=60) -->
  <rect class="tool" x="190" y="60" width="140" height="46" rx="8"/>
  <text class="t" x="260" y="79">ffmpeg</text>
  <text class="s" x="260" y="95">-vn -ac 1 -ar 16000</text>

  <rect class="file" x="360" y="60" width="140" height="46" rx="8"/>
  <text class="t" x="430" y="79">audio.wav</text>
  <text class="s" x="430" y="95">16 kHz mono</text>

  <rect class="tool" x="530" y="60" width="140" height="46" rx="8"/>
  <text class="t" x="600" y="79">faster-whisper</text>
  <text class="s" x="600" y="95">large-v3-turbo · uk</text>

  <rect class="file" x="700" y="60" width="140" height="46" rx="8"/>
  <text class="t" x="770" y="79">audio/output.txt</text>
  <text class="s" x="770" y="95">[start → end] text</text>

  <rect class="tool" x="1040" y="60" width="140" height="46" rx="8"/>
  <text class="t" x="1110" y="79">build_lecture_md.py</text>
  <text class="s" x="1110" y="95">segment → slide by time</text>

  <!-- VIDEO lane (y=170) -->
  <rect class="tool" x="190" y="170" width="140" height="46" rx="8"/>
  <text class="t" x="260" y="189">ffmpeg</text>
  <text class="s" x="260" y="205">crop slide area + scale</text>

  <rect class="file" x="360" y="170" width="140" height="46" rx="8"/>
  <text class="t" x="430" y="189">proxy.mp4</text>
  <text class="s" x="430" y="205">slides only, 640 px</text>

  <rect class="tool" x="530" y="170" width="140" height="46" rx="8"/>
  <text class="t" x="600" y="189">scenedetect</text>
  <text class="s" x="600" y="205">detect-adaptive -m 3s</text>

  <rect class="file" x="700" y="170" width="140" height="46" rx="8"/>
  <text class="t" x="770" y="189">scenes.csv</text>
  <text class="s" x="770" y="205">scene start / end</text>

  <rect class="tool" x="870" y="170" width="140" height="46" rx="8"/>
  <text class="t" x="940" y="189">extract_slides.py</text>
  <text class="s" x="940" y="205">1 frame per scene</text>

  <rect class="file" x="1040" y="170" width="140" height="46" rx="8"/>
  <text class="t" x="1110" y="189">slides/</text>
  <text class="s" x="1110" y="205">*.png + index.csv</text>

  <!-- DOCUMENT lane (y=310), flows right to left -->
  <rect class="file" x="1040" y="310" width="140" height="46" rx="8"/>
  <text class="t" x="1110" y="329">lecture.md</text>
  <text class="s" x="1110" y="345">slides + transcript</text>

  <rect class="llm" x="870" y="310" width="140" height="46" rx="8"/>
  <text class="t" x="940" y="329">Claude</text>
  <text class="s" x="940" y="345">condense Q &amp; A</text>

  <rect class="file" x="700" y="310" width="140" height="46" rx="8"/>
  <text class="t" x="770" y="329">qa_digest.md</text>
  <text class="s" x="770" y="345">20 topics + index</text>

  <rect class="tool" x="530" y="310" width="140" height="46" rx="8"/>
  <text class="t" x="600" y="329">merge + links</text>
  <text class="s" x="600" y="345">Obsidian [[#heading]]</text>

  <rect class="final" x="360" y="310" width="140" height="46" rx="8"/>
  <text class="t" x="430" y="329">lecture.md</text>
  <text class="s" x="430" y="345">final document</text>

  <rect class="dest" x="190" y="310" width="140" height="46" rx="8"/>
  <text class="t" x="260" y="329">Obsidian</text>
  <text class="s" x="260" y="345">polish &amp; search</text>

  <rect class="file" x="530" y="396" width="140" height="40" rx="8" stroke-dasharray="4 3"/>
  <text class="t" x="600" y="413">lecture.orig.md</text>
  <text class="s" x="600" y="428">backup, full transcript</text>

  <!-- arrows: source fan-out -->
  <path class="a" d="M160,187 H174 V83 H187"/>
  <path class="a" d="M160,193 H187"/>

  <!-- audio chain -->
  <path class="a" d="M330,83 H357"/>
  <path class="a" d="M500,83 H527"/>
  <path class="a" d="M670,83 H697"/>
  <path class="a" d="M840,83 H1037"/>

  <!-- video chain -->
  <path class="a" d="M330,193 H357"/>
  <path class="a" d="M500,193 H527"/>
  <path class="a" d="M670,193 H697"/>
  <path class="a" d="M840,193 H867"/>
  <path class="a" d="M1010,193 H1037"/>

  <!-- slides/index.csv up into build_lecture_md.py -->
  <path class="a" d="M1110,170 V109"/>

  <!-- full-resolution frames from the original video -->
  <path class="ad" d="M90,216 V246 H940 V219"/>
  <text class="note" x="515" y="262" text-anchor="middle">full-resolution frames taken from the original video</text>

  <!-- build → lecture.md (document lane) -->
  <path class="a" d="M1180,83 H1210 V333 H1183"/>

  <!-- document chain, right to left -->
  <path class="a" d="M1040,333 H1013"/>
  <path class="a" d="M870,333 H843"/>
  <path class="a" d="M700,333 H673"/>
  <path class="a" d="M530,333 H503"/>
  <path class="a" d="M360,333 H333"/>
  <path class="ad" d="M600,356 V393"/>

  <!-- legend -->
  <rect class="file" x="20" y="404" width="22" height="14" rx="3"/>
  <text class="s sl" x="48" y="415">file</text>
  <rect class="tool" x="90" y="404" width="22" height="14" rx="3"/>
  <text class="s sl" x="118" y="415">tool / script</text>
  <rect class="llm" x="200" y="404" width="22" height="14" rx="3"/>
  <text class="s sl" x="228" y="415">LLM step</text>
  <rect class="final" x="300" y="404" width="22" height="14" rx="3"/>
  <text class="s sl" x="328" y="415">result</text>
</svg>
